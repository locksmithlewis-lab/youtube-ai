name: Offline Render Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/offline_render_batch.json'
      - 'scripts/render_video.py'
      - 'scripts/render_with_metrics.py'
      - 'scripts/storage_upload.py'
      - 'scripts/r2_storage.py'
      - 'scripts/register_offline_renders.py'
      - 'scripts/publish_offline_batch.js'
      - 'scripts/publish_offline_direct.js'
      - '.github/workflows/offline-render-batch.yml'

permissions:
  contents: read

concurrency:
  group: offline-render-batch-main
  cancel-in-progress: false

jobs:
  media-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify R2 capacity
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_EXPECTED_RENDER_BYTES: '750000000'
          ROLIXA_STORAGE_HEADROOM_BYTES: '250000000'
          ROLIXA_ALLOW_B2_MEDIA: '0'
        run: |
          python -m pip install --quiet boto3
          python scripts/storage_preflight.py

  render:
    needs: media-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Validate publishing code and batch manifest
        run: |
          node --check scripts/publish_offline_direct.js
          python -m json.tool config/offline_render_batch.json >/dev/null
      - name: Install renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet boto3 piper-tts==1.6.0
      - name: Render five normal videos sequentially
        env:
          ROLIXA_OFFLINE_MODE: '1'
          ROLIXA_OFFLINE_BATCH: config/offline_render_batch.json
          PYTHONPATH: scripts
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_R2_PRESIGN_SECONDS: '518400'
          GENERATIVE_VIDEO_ENABLED: '0'
          GENERATIVE_VIDEO_PERCENT: '0'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -euo pipefail
          for worker in 1 2 3 4 5; do
            echo "::group::Rendering batch member $worker of 5"
            export ROLIXA_WORKER="$worker"
            python scripts/render_with_metrics.py
            echo "::endgroup::"
          done

      - name: Publish every rendered video directly from R2 and verify public status
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ROLIXA_OFFLINE_BATCH: config/offline_render_batch.json
        run: |
          set -euo pipefail
          python -m pip install --quiet boto3
          RESPONSE_FILE="$RUNNER_TEMP/youtube-oauth-response.json"
          HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$YOUTUBE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          if [ "$HTTP_STATUS" != "200" ]; then
            python - "$RESPONSE_FILE" "$HTTP_STATUS" <<'PY'
          import json,sys
          try:
              body=json.load(open(sys.argv[1],encoding="utf-8"))
              error=body.get("error","unknown_error")
              detail=body.get("error_description","No details returned")
              print(f"Google OAuth refresh failed (HTTP {sys.argv[2]}): {error}: {detail}")
              if error=="invalid_grant":
                  print("Likely cause: refresh token expired/revoked, or OAuth consent screen is in Testing. For an External app using YouTube scopes, set Publishing status to In production and generate a fresh refresh token with the required YouTube upload scope.")
          except Exception:
              print(f"Google OAuth refresh failed (HTTP {sys.argv[2]}): response could not be parsed")
          PY
            exit 1
          fi
          export YOUTUBE_ACCESS_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' < "$RESPONSE_FILE")"
          test -n "$YOUTUBE_ACCESS_TOKEN"
          echo "::add-mask::$YOUTUBE_ACCESS_TOKEN"
          node scripts/publish_offline_direct.js

      - name: Save per-video publication report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offline-publish-results
          path: offline-publish-results.json
          if-no-files-found: warn
          retention-days: 14

      - name: Optional Supabase status registration (non-blocking)
        continue-on-error: true
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_OFFLINE_BATCH: config/offline_render_batch.json
          ROLIXA_R2_PRESIGN_SECONDS: '518400'
        run: |
          python -m pip install --quiet boto3 requests
          python scripts/register_offline_renders.py
