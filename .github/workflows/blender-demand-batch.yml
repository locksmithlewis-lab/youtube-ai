name: Blender Demand Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/blender_demand_batch.json'
      - 'scripts/render_video.py'
      - 'scripts/finish_blender_video.py'
      - 'scripts/publish_blender_demand_direct.js'
      - '.github/workflows/blender-demand-batch.yml'

permissions:
  contents: read

concurrency:
  group: blender-demand-batch-main
  cancel-in-progress: true

jobs:
  media-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install storage client
        run: python -m pip install --quiet boto3
      - name: Verify R2 capacity
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_EXPECTED_RENDER_BYTES: '1000000000'
          ROLIXA_STORAGE_HEADROOM_BYTES: '250000000'
        run: python scripts/storage_preflight.py

  render:
    needs: media-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Install Blender renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg fonts-dejavu-core
          python -m pip install --quiet boto3 piper-tts==1.6.0
      - name: Render five Blender videos sequentially
        env:
          ROLIXA_OFFLINE_MODE: '1'
          ROLIXA_OFFLINE_BATCH: config/blender_demand_batch.json
          PYTHONPATH: scripts
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_R2_PRESIGN_SECONDS: '518400'
          GENERATIVE_VIDEO_ENABLED: '0'
          GENERATIVE_VIDEO_PERCENT: '0'
        run: |
          set -euo pipefail
          for worker in 1 2 3 4 5; do
            echo "::group::Rendering Blender demand video $worker of 5"
            export ROLIXA_WORKER="$worker"
            python scripts/render_with_metrics.py
            echo "::endgroup::"
          done
      - name: Publish all five Blender videos to YouTube
        env:
          ROLIXA_OFFLINE_BATCH: config/blender_demand_batch.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YOUTUBE_ACCESS_TOKEN: ${{ secrets.YOUTUBE_ACCESS_TOKEN }}
        run: node scripts/publish_blender_demand_direct.js
      - name: Save per-video publication report
        uses: actions/upload-artifact@v4
        with:
          name: blender-publish-results
          path: blender-publish-results.json
          if-no-files-found: error
          retention-days: 14
