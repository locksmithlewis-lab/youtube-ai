name: Blender Demand Batch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'config/blender_demand_batch.json'
      - 'scripts/render_video.py'
      - 'scripts/finish_blender_video.py'
      - 'scripts/publish_blender_demand_direct.js'
      - '.github/workflows/blender-demand-batch.yml'

permissions:
  contents: read

concurrency:
  group: blender-demand-batch-main
  cancel-in-progress: true

jobs:
  media-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install storage client
        run: python -m pip install --quiet boto3
      - name: Verify R2 capacity
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_EXPECTED_RENDER_BYTES: '1000000000'
          ROLIXA_STORAGE_HEADROOM_BYTES: '250000000'
        run: python scripts/storage_preflight.py

  render:
    needs: media-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
      - name: Install Blender renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq blender ffmpeg fonts-dejavu-core
          python -m pip install --quiet boto3 piper-tts==1.6.0
      - name: Render five Blender videos sequentially
        env:
          ROLIXA_OFFLINE_MODE: '1'
          ROLIXA_OFFLINE_BATCH: config/blender_demand_batch.json
          PYTHONPATH: scripts
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_R2_PRESIGN_SECONDS: '518400'
          GENERATIVE_VIDEO_ENABLED: '0'
          GENERATIVE_VIDEO_PERCENT: '0'
        run: |
          set -euo pipefail
          for worker in 1 2 3 4 5; do
            echo "::group::Rendering Blender demand video $worker of 5"
            export ROLIXA_WORKER="$worker"
            python scripts/render_with_metrics.py
            echo "::endgroup::"
          done
      - name: Obtain short-lived YouTube access token
        id: youtube_auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/youtube-oauth-response.json"
          HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$YOUTUBE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          if [ "$HTTP_STATUS" != "200" ]; then
            python - "$RESPONSE_FILE" "$HTTP_STATUS" <<'PY'
          import json, sys
          try:
              body = json.load(open(sys.argv[1], encoding="utf-8"))
              print(f"Google OAuth failed (HTTP {sys.argv[2]}): {body.get('error','unknown_error')}: {body.get('error_description','No details returned')}")
          except Exception:
              print(f"Google OAuth failed (HTTP {sys.argv[2]}): response could not be parsed")
          PY
            exit 1
          fi
          ACCESS_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' < "$RESPONSE_FILE")"
          GRANTED_SCOPES="$(python -c 'import json,sys; print(json.load(sys.stdin).get("scope", ""))' < "$RESPONSE_FILE")"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "Google granted OAuth scopes: ${GRANTED_SCOPES:-not returned}"
          if [[ " $GRANTED_SCOPES " != *" https://www.googleapis.com/auth/youtube.upload "* ]]; then echo "Refresh token lacks youtube.upload scope."; exit 1; fi
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Publish all five Blender videos to YouTube
        env:
          ROLIXA_OFFLINE_BATCH: config/blender_demand_batch.json
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YOUTUBE_ACCESS_TOKEN: ${{ steps.youtube_auth.outputs.access_token }}
        run: node scripts/publish_blender_demand_direct.js
      - name: Save per-video publication report
        uses: actions/upload-artifact@v4
        with:
          name: blender-publish-results
          path: blender-publish-results.json
          if-no-files-found: error
          retention-days: 14
      - name: Report failure clearly
        if: failure()
        run: |
          {
            echo "## ROLIXA BLENDER BATCH FAILED"
            echo ""
            echo "The Blender render-and-publish workflow failed. Open this run's failed step logs before retrying; do not rerun blindly if any uploads may already have completed."
            echo ""
            echo "Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Rolixa Blender batch failed::Open the Actions run summary and failed-step logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
