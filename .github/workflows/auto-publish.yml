name: Auto publish ready videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'api/auto-publish-ready.js'
      - 'api/audit-published.js'
      - 'api/cleanup-duplicates.js'
      - 'lib/hashtags.js'
      - '.github/workflows/auto-publish.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: rolixa-auto-publish
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Supabase DNS without failing the workflow
        id: check
        shell: bash
        run: |
          if python - <<'PY'
          import socket, sys
          try:
              socket.getaddrinfo('uqmnpeovwfzizajheuig.supabase.co', 443)
          except OSError as exc:
              print(f'Supabase DNS unavailable: {exc}')
              sys.exit(1)
          print('Supabase DNS resolves.')
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase-dependent work will be skipped; independent R2 publishing remains available."
          fi

  publish:
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Clean public metadata and remove weak published placeholders
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SERVICE_KEY"
          curl --fail-with-body --retry 2 --max-time 840 \
            -X POST 'https://riloxa-bey56lewis-4041.vercel.app/api/audit-published' \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}'

      - name: Remove duplicate public uploads
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SERVICE_KEY"
          curl --fail-with-body --retry 2 --max-time 840 \
            -X POST 'https://riloxa-bey56lewis-4041.vercel.app/api/cleanup-duplicates' \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H 'Content-Type: application/json' \
            --data '{}'

      - name: Publish every rendered QC-cleared video as Public
        env:
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SERVICE_KEY"
          echo "Starting publish drain for all ready, QC-cleared videos."
          for pass in $(seq 1 20); do
            echo "Publish pass $pass"
            RESPONSE=$(curl --fail-with-body --retry 2 --max-time 840 \
              -X POST 'https://riloxa-bey56lewis-4041.vercel.app/api/auto-publish-ready' \
              -H "Authorization: Bearer $SERVICE_KEY" \
              -H 'Content-Type: application/json' \
              --data '{}')
            echo "$RESPONSE"
            PROCESSED=$(python -c 'import json,sys; print(json.load(sys.stdin).get("processed",0))' <<< "$RESPONSE")
            if [ "$PROCESSED" -eq 0 ]; then
              echo "All currently rendered/QC-cleared videos have been processed."
              break
            fi
          done

