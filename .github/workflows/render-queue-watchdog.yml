name: Render Queue Watchdog

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  actions: write
  contents: read

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect and clean stale render runs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          now=$(date +%s)
          echo "Render queue watchdog: $REPO"

          gh run list --repo "$REPO" --limit 100 --json databaseId,name,status,createdAt,workflowName,headBranch             > /tmp/runs.json

          python - <<'PY'
          import json, os, subprocess, time
          repo=os.environ["REPO"]
          now=time.time()
          runs=json.load(open("/tmp/runs.json"))
          watched={"Offline Render Batch","Render queued videos"}
          stale=[]
          for r in runs:
              if r["workflowName"] not in watched:
                  continue
              if r["status"] not in {"queued","pending","in_progress"}:
                  continue
              created=r.get("createdAt")
              if not created:
                  continue
              # Give GitHub 15 minutes to assign/start a runner.
              age=now-time.mktime(time.strptime(created[:19], "%Y-%m-%dT%H:%M:%S"))
              if age > 900:
                  stale.append(r)
          for r in stale:
              print(f"Cancelling stale {r['workflowName']} #{r['databaseId']}")
              subprocess.run(["gh","run","cancel",str(r["databaseId"]),"-R",repo],check=False)

          # If the offline batch has no active run after cleanup, restart only when
          # the queue definition has not yet been successfully processed.
          active=[r for r in runs if r["workflowName"]=="Offline Render Batch"
                  and r["status"] in {"queued","pending","in_progress"}]
          latest_queue=subprocess.check_output(
              ["gh","api",f"repos/{repo}/contents/config/offline_render_batch.json",
               "--jq",".sha"],text=True).strip()
          completed=subprocess.check_output(
              ["gh","run","list","-R",repo,"-w","Offline Render Batch","--status","success",
               "--limit","20","--json","headSha"],text=True)
          successful={x["headSha"] for x in json.loads(completed)}
          if not active and latest_queue not in successful:
              print("No active Offline Render Batch has successfully processed the current queue definition; dispatching a recovery run.")
              subprocess.run(["gh","workflow","run","Offline Render Batch","-R",repo,"--ref","main"],check=False)

          print(f"Watchdog inspected {len(runs)} runs; cancelled {len(stale)} stale render runs.")
          PY
