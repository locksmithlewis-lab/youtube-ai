name: Auto quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_quality.py'
      - 'scripts/repair_failed.py'
      - 'scripts/series_controller.py'
      - 'scripts/production_guard.py'
      - 'scripts/production_watchdog.py'
      - 'scripts/shortform_writer.py'
      - 'scripts/sitecustomize.py'
      - '.github/workflows/auto-quality.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: production-auto-quality
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Reconcile and repair production state when Supabase is reachable
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROLIXA_MAX_IDLE_HOURS: '24'
          ROLIXA_MIN_READY_BACKLOG: '3'
          ROLIXA_STUCK_GENERATING_HOURS: '1.5'
          ROLIXA_MAX_STUCK_REQUEUES: '8'
          ROLIXA_WATCHDOG_FAIL_ON_STALL: '0'
          PYTHONPATH: scripts
        shell: bash
        run: |
          set +e
          code=$(curl --silent --output /dev/null --max-time 12 --write-out '%{http_code}' "$SUPABASE_URL/rest/v1/" 2>/dev/null || true)
          if [ -z "$code" ] || [ "$code" = "000" ]; then
            echo "::warning::Supabase DNS/network is unavailable. Skipping database-backed repairs; R2 rendering and direct YouTube publishing are independent."
            echo "DATABASE_REPAIRS_SKIPPED: Supabase control plane unavailable; no database state was changed."
            exit 0
          fi
          set -e
          python scripts/series_controller.py
          python scripts/repair_failed.py
          python scripts/auto_quality.py
          python scripts/production_watchdog.py
