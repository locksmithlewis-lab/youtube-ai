name: Auto quality gate

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/auto_quality.py'
      - '.github/workflows/auto-quality.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

concurrency:
  group: rolixa-auto-quality
  cancel-in-progress: false

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Advance completed videos through the right quality gate
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/auto_quality.py
