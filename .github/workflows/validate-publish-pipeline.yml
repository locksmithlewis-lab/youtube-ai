name: Validate Publish Pipeline

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/publish_offline_direct.js'
      - 'scripts/publish_blender_demand_direct.js'
      - 'config/offline_render_batch.json'
      - 'config/blender_demand_batch.json'
      - '.github/workflows/offline-render-batch.yml'
      - '.github/workflows/blender-demand-batch.yml'
      - '.github/workflows/render-queue-watchdog.yml'
      - '.github/workflows/validate-publish-pipeline.yml'
  push:
    branches: [fix/watchdog-idempotent-publishing]
    paths:
      - 'scripts/publish_offline_direct.js'
      - 'scripts/publish_blender_demand_direct.js'
      - 'config/offline_render_batch.json'
      - 'config/blender_demand_batch.json'
      - '.github/workflows/offline-render-batch.yml'
      - '.github/workflows/blender-demand-batch.yml'
      - '.github/workflows/render-queue-watchdog.yml'
      - '.github/workflows/validate-publish-pipeline.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check scripts/publish_offline_direct.js
          node --check scripts/publish_blender_demand_direct.js
      - name: Validate batch JSON
        run: |
          python -m json.tool config/offline_render_batch.json >/dev/null
          python -m json.tool config/blender_demand_batch.json >/dev/null
      - name: Parse workflow YAML
        run: |
          python -m pip install --quiet PyYAML
          python - <<'PY'
          from pathlib import Path
          import yaml
          files = [
              ".github/workflows/offline-render-batch.yml",
              ".github/workflows/blender-demand-batch.yml",
              ".github/workflows/render-queue-watchdog.yml",
              ".github/workflows/validate-publish-pipeline.yml",
          ]
          for name in files:
              with Path(name).open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print("YAML parsed:", name)
          PY
