name: Storage retention and production status

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/storage_retention.py'
      - 'scripts/production_status.py'
      - '.github/workflows/storage-retention.yml'

permissions:
  contents: read

concurrency:
  group: rolixa-storage-retention
  cancel-in-progress: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.backend.outputs.available }}
    steps:
      - name: Check Supabase backend availability
        id: backend
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/supabase-check.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/video_projects?select=id&limit=1")
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase unavailable/restricted (HTTP $code). Retention skipped."
          fi

  retention:
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Inspect production state
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/production_status.py
      - name: Delete only non-essential published MP4 archives
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROLIXA_ARCHIVE_AFTER_DAYS: '2'
          ROLIXA_KEEP_VIEWS: '100'
          ROLIXA_STORAGE_BUCKET: video-outputs
        run: python3 scripts/storage_retention.py
