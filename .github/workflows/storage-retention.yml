name: External media retention and production status

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/r2_retention.py'
      - 'scripts/b2_retention.py'
      - 'scripts/r2_storage.py'
      - 'scripts/b2_storage.py'
      - 'scripts/storage_upload.py'
      - '.github/workflows/storage-retention.yml'

permissions:
  contents: read

concurrency:
  group: rolixa-external-media-retention
  cancel-in-progress: true

  r2-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install R2 client
        run: python -m pip install --quiet boto3
      - name: Retain only recent R2 MP4s
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_RETENTION_DAYS: '2'
          ROLIXA_R2_RETENTION_DRY_RUN: '0'
        run: python3 scripts/r2_retention.py

  b2-retention:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install B2 client
        run: python -m pip install --quiet boto3
      - name: Retain only recent B2 MP4s
        env:
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
          ROLIXA_B2_RETENTION_DAYS: '2'
          ROLIXA_B2_RETENTION_DRY_RUN: '0'
        run: python3 scripts/b2_retention.py
