name: Generate due series episodes

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: rolixa-series-generator
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      available: ${{ steps.check.outputs.available }}
    steps:
      - name: Check Supabase DNS without failing the workflow
        id: check
        shell: bash
        run: |
          if python - <<'PY'
          import socket, sys
          try:
              socket.getaddrinfo('uqmnpeovwfzizajheuig.supabase.co', 443)
          except OSError as exc:
              print(f'Supabase DNS unavailable: {exc}')
              sys.exit(1)
          print('Supabase DNS resolves.')
          PY
          then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "Supabase-dependent work will be skipped; independent R2 publishing remains available."
          fi

  generate:
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Generate episodes due now
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/generate_series_episode.py
