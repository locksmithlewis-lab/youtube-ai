name: Render queued videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_video.py'
      - 'scripts/render_with_metrics.py'
      - 'scripts/visual_sources.py'
      - '.github/workflows/render-video.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - worker: 1
            voice: en_US-lessac-medium
          - worker: 2
            voice: en_US-ryan-medium
          - worker: 3
            voice: en_US-amy-medium
          - worker: 4
            voice: en_GB-alba-medium
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .piper-voices
          key: piper-voice-pool-v2

      - name: Restore visual search cache
        uses: actions/cache@v4
        with:
          path: .rolixa-cache
          key: ${{ runner.os }}-rolixa-visual-v3-${{ github.run_id }}-${{ matrix.worker }}
          restore-keys: |
            ${{ runner.os }}-rolixa-visual-v3-

      - name: Install cinematic renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet piper-tts==1.6.0

      - name: Atomically claim and render one queued project
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIPER_VOICE: ${{ matrix.voice }}
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          ROLIXA_WORKER: ${{ matrix.worker }}
        run: python scripts/render_with_metrics.py
