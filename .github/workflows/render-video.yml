name: Render queued videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_video.py'
      - 'scripts/render_with_metrics.py'
      - 'scripts/shortform_writer.py'
      - 'scripts/longform_writer.py'
      - 'scripts/visual_sources.py'
      - 'scripts/storage_upload.py'
      - 'scripts/r2_storage.py'
      - 'scripts/b2_storage.py'
      - 'scripts/production_guard.py'
      - 'scripts/media_integrity.py'
      - 'scripts/storage_preflight.py'
      - 'scripts/engagement_overlay.py'
      - '.github/workflows/render-video.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Auto quality gate']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-fleet-main
  cancel-in-progress: false

jobs:
  preflight:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.backend.outputs.available }}
      has_jobs: ${{ steps.backend.outputs.has_jobs }}
    steps:
      - name: Check Supabase backend availability
        id: backend
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/supabase-check.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/video_projects?select=id&limit=1")
          if [ "$code" != "200" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase unavailable/restricted (HTTP $code). Render fleet skipped."
            exit 0
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
          queue_code=$(curl -sS -o /tmp/rolixa-queue.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/render_jobs?status=eq.queued&select=id&limit=1")
          if [ "$queue_code" != "200" ]; then
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Could not inspect the render queue (HTTP $queue_code); skipping workers safely."
          elif python -c 'import json,sys; sys.exit(0 if not json.load(open(sys.argv[1])) else 1)' /tmp/rolixa-queue.json; then
            echo "has_jobs=false" >> "$GITHUB_OUTPUT"
            echo "Queue is empty; no renderer workers will start."
          else
            echo "has_jobs=true" >> "$GITHUB_OUTPUT"
            echo "Queued render found; starting one free-mode worker."
          fi

  media-storage-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Verify external media storage capacity before starting a worker
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          ROLIXA_B2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_ALLOW_B2_MEDIA: '0'
          ROLIXA_EXPECTED_RENDER_BYTES: '750000000'
          ROLIXA_STORAGE_HEADROOM_BYTES: '250000000'
        run: |
          python -m pip install --quiet boto3
          python scripts/storage_preflight.py

  render:
    needs: [preflight, media-storage-preflight]
    if: needs.preflight.outputs.available == 'true' && needs.media-storage-preflight.result == 'success' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        worker: [1]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - name: Select voice
        run: |
          case $(( ${{ matrix.worker }} % 3 )) in
            1) echo 'PIPER_VOICE=en_US-lessac-medium' >> "$GITHUB_ENV" ;;
            2) echo 'PIPER_VOICE=en_GB-alba-medium' >> "$GITHUB_ENV" ;;
            0) echo 'PIPER_VOICE=en_US-amy-medium' >> "$GITHUB_ENV" ;;
          esac
      - name: Install renderer
        run: |
          python -m pip install --quiet boto3
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v blender >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core blender; fi
          blender --version
          python - <<'PY' || python -m pip install --quiet piper-tts==1.6.0
          import piper
          PY
      - name: Render with quality gates
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GENERATIVE_VIDEO_ENABLED: '0'
          GENERATIVE_VIDEO_PERCENT: '0'
          PYTHONPATH: scripts
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
          B2_ACCESS_KEY_ID: ${{ secrets.B2_ACCESS_KEY_ID }}
          B2_SECRET_ACCESS_KEY: ${{ secrets.B2_SECRET_ACCESS_KEY }}
          B2_BUCKET: ${{ secrets.B2_BUCKET }}
          B2_REGION: ${{ secrets.B2_REGION }}
          ROLIXA_B2_MAX_STORAGE_BYTES: '9000000000'
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          ROLIXA_R2_MAX_STORAGE_BYTES: '9000000000'
          ROLIXA_R2_PRESIGN_SECONDS: '518400'
          ROLIXA_WORKER: ${{ matrix.worker }}
        run: python scripts/render_with_metrics.py

# Manual queue kick: run the existing renderer against the current queued job.
