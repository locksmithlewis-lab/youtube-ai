name: Render queued videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_video.py'
      - 'scripts/render_with_metrics.py'
      - 'scripts/engagement_overlay.py'
      - '.github/workflows/render-video.yml'
  schedule:
    - cron: '*/5 * * * *'
  workflow_run:
    workflows: ['Auto quality gate']
    types: [completed]

permissions:
  contents: read

concurrency:
  group: render-fleet-main
  cancel-in-progress: true

jobs:
  preflight:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.backend.outputs.available }}
    steps:
      - name: Select voice
        if: steps.backend.outputs.available == 'true'
        run: |
          case $(( ${{ matrix.worker }} % 3 )) in
            1) echo 'PIPER_VOICE=en_US-lessac-medium' >> "$GITHUB_ENV" ;;
            2) echo 'PIPER_VOICE=en_GB-alba-medium' >> "$GITHUB_ENV" ;;
            0) echo 'PIPER_VOICE=en_US-amy-medium' >> "$GITHUB_ENV" ;;
          esac
      - name: Install renderer
        if: steps.backend.outputs.available == 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v blender >/dev/null 2>&1; then sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core blender; fi
          blender --version
          python - <<'PY' || python -m pip install --quiet piper-tts==1.6.0
          import piper
          PY
      - name: Render with quality gates
        if: steps.backend.outputs.available == 'true'
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Free-tier mode: paid AI/video APIs are intentionally disabled.
          GENERATIVE_VIDEO_ENABLED: '0'
          GENERATIVE_VIDEO_PERCENT: '0'
          PYTHONPATH: scripts
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          ROLIXA_WORKER: ${{ matrix.worker }}
        run: python scripts/render_with_metrics.py
