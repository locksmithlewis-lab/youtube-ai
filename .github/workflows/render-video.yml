name: Render queued videos

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/render_video.py'
      - 'scripts/render_with_metrics.py'
      - 'scripts/visual_sources.py'
      - 'scripts/longform_writer.py'
      - 'scripts/generative_video.py'
      - 'scripts/sitecustomize.py'
      - 'api/auto-publish-ready.js'
      - '.github/workflows/render-video.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read

jobs:
  render:
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - worker: 1
            voice: en_US-lessac-medium
          - worker: 2
            voice: en_US-ryan-medium
          - worker: 3
            voice: en_US-amy-medium
          - worker: 4
            voice: en_GB-alba-medium
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - name: Cache Piper voices
        uses: actions/cache@v4
        with:
          path: .piper-voices
          key: piper-voice-pool-v2

      - name: Restore visual search cache
        uses: actions/cache@v4
        with:
          path: .rolixa-cache
          key: ${{ runner.os }}-motion-visual-v5-${{ github.run_id }}-${{ matrix.worker }}
          restore-keys: |
            ${{ runner.os }}-motion-visual-v5-

      - name: Install production renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python -m pip install --quiet piper-tts==1.6.0

      - name: Render and immediately publish only if publish-grade QC passes
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          RUNWAYML_API_SECRET: ${{ secrets.RUNWAYML_API_SECRET }}
          LUMA_API_KEY: ${{ secrets.LUMA_API_KEY }}
          ROLIXA_WRITER_MODEL: gpt-5.6
          GENERATIVE_VIDEO_ENABLED: '1'
          GENERATIVE_VIDEO_PERCENT: '25'
          PYTHONPATH: scripts
          PIPER_VOICE: ${{ matrix.voice }}
          PIPER_VOICE_DIR: .piper-voices
          ROLIXA_VISUAL_CACHE: .rolixa-cache
          ROLIXA_WORKER: ${{ matrix.worker }}
          PUBLISH_URL: https://riloxa-bey56lewis-4041.vercel.app/api/auto-publish-ready
        run: |
          set -euo pipefail
          python scripts/render_with_metrics.py | tee render.log
          PROJECT_ID=$(python - <<'PY'
          import re
          text=open('render.log',encoding='utf-8',errors='ignore').read()
          matches=re.findall(r'Rendered\s+[^/\s]+/([^/\s]+)/[^:\s]+\.mp4:',text)
          print(matches[-1] if matches else '')
          PY
          )
          if [ -z "$PROJECT_ID" ]; then
            echo "No publish-grade rendered project found."
            exit 0
          fi
          echo "Publishing QC-approved project $PROJECT_ID as Public"
          curl --fail-with-body --retry 2 --max-time 840 \
            -X POST "$PUBLISH_URL" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            -H 'Content-Type: application/json' \
            --data "{\"project_id\":\"$PROJECT_ID\"}"
