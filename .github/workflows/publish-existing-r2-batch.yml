name: Publish Existing R2 Batch

on:
  workflow_dispatch:
  push:
    paths:
      - 'config/publish_existing_r2.trigger'

permissions:
  contents: read
  id-token: write

concurrency:
  group: offline-direct-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Install R2 client
        run: python -m pip install --quiet boto3
      - name: Obtain short-lived YouTube access
        id: youtube_auth
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          set -euo pipefail
          RESPONSE_FILE="$RUNNER_TEMP/youtube-oauth-response.json"
          HTTP_STATUS="$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" -X POST https://oauth2.googleapis.com/token \
            -H "Content-Type: application/x-www-form-urlencoded" \
            --data-urlencode "client_id=$GOOGLE_CLIENT_ID" \
            --data-urlencode "client_secret=$GOOGLE_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$YOUTUBE_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token")"
          if [ "$HTTP_STATUS" != "200" ]; then
            python - "$RESPONSE_FILE" "$HTTP_STATUS" <<'PY'
          import json, sys
          path, status = sys.argv[1], sys.argv[2]
          try:
              body = json.load(open(path, encoding="utf-8"))
              error = body.get("error", "unknown_error")
              detail = body.get("error_description", "No error description returned.")
          except Exception:
              error, detail = "unreadable_response", "Google returned a response that could not be parsed."
          print(f"Google OAuth token exchange failed (HTTP {status}): {error}: {detail}")
          PY
            exit 1
          fi
          RESPONSE="$(cat "$RESPONSE_FILE")"
          ACCESS_TOKEN="$(python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])' <<<"$RESPONSE")"
          GRANTED_SCOPES="$(python -c 'import json,sys; print(json.load(sys.stdin).get("scope", ""))' <<<"$RESPONSE")"
          test -n "$ACCESS_TOKEN"
          echo "::add-mask::$ACCESS_TOKEN"
          echo "Google granted OAuth scopes: ${GRANTED_SCOPES:-not returned by token endpoint}"
          if [[ " $GRANTED_SCOPES " != *" https://www.googleapis.com/auth/youtube.upload "* ]] || [[ " $GRANTED_SCOPES " != *" https://www.googleapis.com/auth/youtube.readonly "* ]]; then
            echo "OAuth scope check failed: the saved refresh token must grant both youtube.upload and youtube.readonly. Re-authorize both scopes with the same OAuth client, then replace YOUTUBE_REFRESH_TOKEN in GitHub Secrets."
            exit 1
          fi
          echo "access_token=$ACCESS_TOKEN" >> "$GITHUB_OUTPUT"
      - name: Publish already-rendered videos and verify public status
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          YOUTUBE_ACCESS_TOKEN: ${{ steps.youtube_auth.outputs.access_token }}
          ROLIXA_OFFLINE_BATCH: config/offline_render_batch.json
        run: node scripts/publish_offline_direct.js
      - name: Save verified publication report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: offline-publish-results
          path: offline-publish-results.json
          if-no-files-found: error
          retention-days: 30
