name: Production watchdog recovery

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/production_watchdog.py'
      - 'scripts/production_troubleshooter.py'
      - '.github/workflows/production-watchdog.yml'

permissions:
  contents: read

concurrency:
  group: rolixa-production-watchdog
  cancel-in-progress: true

jobs:
  troubleshoot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - name: Run bounded troubleshooter
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROLIXA_STUCK_GENERATING_HOURS: '1.5'
          ROLIXA_TROUBLESHOOT_MAX_REQUEUES: '1'
          ROLIXA_MAX_IDLE_HOURS: '24'
        run: python3 scripts/production_troubleshooter.py

  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      available: ${{ steps.backend.outputs.available }}
    steps:
      - name: Check Supabase backend availability
        id: backend
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set +e
          code=$(curl -sS -o /tmp/supabase-check.json -w "%{http_code}" \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$SUPABASE_URL/rest/v1/video_projects?select=id&limit=1")
          if [ "$code" = "200" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase unavailable/restricted (HTTP $code). Watchdog skipped."
          fi

  watchdog:
    needs: preflight
    if: needs.preflight.outputs.available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - name: Diagnose and recover
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ROLIXA_MAX_IDLE_HOURS: '24'
          ROLIXA_MIN_READY_BACKLOG: '3'
          ROLIXA_STUCK_GENERATING_HOURS: '1.5'
          ROLIXA_MAX_STUCK_REQUEUES: '8'
          ROLIXA_WATCHDOG_FAIL_ON_STALL: '0'
          PYTHONPATH: scripts
        run: python3 scripts/production_watchdog.py
