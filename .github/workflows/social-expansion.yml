name: Social expansion manifest

on:
  workflow_dispatch:
  schedule:
    - cron: '41 */6 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/social_expansion.py'
      - '.github/workflows/social-expansion.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Build platform-ready distribution plan
        env:
          SUPABASE_URL: https://uqmnpeovwfzizajheuig.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 scripts/social_expansion.py
