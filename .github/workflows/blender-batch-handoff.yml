name: Blender Batch Handoff

on:
  workflow_run:
    workflows: ["Offline Render Batch"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  handoff:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Launch Blender demand batch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/blender-demand-batch.yml/dispatches" \
            -d '{"ref":"main"}'
          echo "Blender demand batch dispatched after all five normal videos completed successfully."
